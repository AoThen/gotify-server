# Example configuration file for server.
# Save it to `config.yml` when edited

server:
  keepaliveperiodseconds: 0
  listenaddr: ""
  port: 80

  ssl:
    enabled: false
    redirecttohttps: true
    listenaddr: ""
    port: 443
    certfile:
    certkey:
    letsencrypt:
      enabled: false
      accepttos: false
      cache: data/certs
      directoryurl:
      hosts:

  responseheaders:

  trustedproxies:

  cors:
    alloworigins:
    allowmethods:
    allowheaders:

  stream:
    pingperiodseconds: 45
    allowedorigins:

  # Tiered rate limiting (Option A)
  ratelimit:
    # Level 1: Global rate limiting (all requests)
    global:
      enabled: true
      requestspersecond: 20
      burst: 50

    # Level 2: Authenticated API (Client Token, Admin)
    auth:
      enabled: true
      requestspersecond: 10
      burst: 20

    # Level 3: Message sending (Application Token)
    message:
      enabled: true
      requestspersecond: 15
      burst: 30

    # Level 4: Admin API
    admin:
      enabled: true
      requestspersecond: 5
      burst: 10

  # Blacklist configuration (Phase 2)
  authblacklist:
    enabled: true
    maxfailures: 5
    windowseconds: 300
    blockduration: 3600
    cleanupinterval: 300
    whitelist:
      - "127.0.0.1"
      - "192.168.1.0/24"

database:
  dialect: sqlite3
  connection: data/gotify.db

defaultuser:
  name: admin
  pass: admin
passstrength: 10
uploadedimagesdir: data/images
pluginsdir: data/plugins
registration: false
